name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (zero warnings)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Formatting
        run: bun run format:check

      - name: Unit tests
        run: bun run test

      - name: Content integrity audit
        run: bun run audit:content

      - name: Production build (client + SSR)
        run: bun run build

      - name: SSR smoke tests
        run: bun run smoke
